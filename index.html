<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My First App</title>
    <style>
      .call-button {
        display: block;
        box-sizing: border-box;
        width: 100%;
        max-width: 420px;
        padding: 14px 20px;
        color: #fff;
        background: linear-gradient(110deg, #0a5fc4 35%, #63b2ff 50%, #0a5fc4 65%);
        background-size: 220% 100%;
        border: 1px solid #064d9e;
        border-radius: 8px;
        box-shadow: 0 4px 0 #064d9e, 0 6px 10px rgb(0 0 0 / 20%);
        font: 700 18px/1.2 Arial, sans-serif;
        text-align: center;
        text-decoration: none;
        animation: call-shine 2.8s ease-in-out infinite;
      }

      .call-button:active {
        animation-play-state: paused;
        transform: translateY(3px);
        box-shadow: 0 1px 0 #064d9e;
      }

      @keyframes call-shine {
        0%, 35% {
          background-position: 100% 0;
        }

        70%, 100% {
          background-position: 0 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .call-button {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Merge 8</h1>
    <a class="call-button" href="tel:+919899781169">Call Us</a>
  </body>
</html>
